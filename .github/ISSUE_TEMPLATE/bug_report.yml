name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Pro 13-inch 2019, macOS 15.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the menu bar, choose Revive the Touchbar, then About.
  - type: markdown
    attributes:
      value: Please don't paste license keys or payment details here. Email support instead.
